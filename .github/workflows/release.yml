name: release-build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build
      - name: Release metadata consistency
        run: python scripts/release_check.py
      - name: Regression benchmark
        run: PYTHONPATH=src python -m ot_risk_lab benchmark examples/benchmark_suite.json
      - name: Build distributions
        run: python -m build
      - name: Generate CycloneDX SBOM
        run: python scripts/generate_sbom.py dist/sbom.cdx.json
      - name: Distribution checksums
        run: sha256sum dist/* > SHA256SUMS.txt
      - name: Container smoke test
        run: |
          docker build -t ot-risk-lab:${GITHUB_REF_NAME} .
          docker run --rm ot-risk-lab:${GITHUB_REF_NAME} --version
          docker run --rm ot-risk-lab:${GITHUB_REF_NAME} doctor
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*
            SHA256SUMS.txt
