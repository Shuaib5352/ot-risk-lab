name: one-time-ci-repair
# rerun after repository identity correction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-hotfix.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install development tools
        run: python -m pip install -e ".[dev]"

      - name: Apply Ruff safe fixes
        shell: bash
        run: |
          set +e
          ruff check src tests --fix
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            exit "$rc"
          fi

      - name: Apply explicit zip strictness fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              Path("src/ot_risk_lab/markov.py"): (
                  "dict(zip(self.states, self.history[-1]))",
                  "dict(zip(self.states, self.history[-1], strict=True))",
              ),
              Path("src/ot_risk_lab/monte_carlo.py"): (
                  "zip(dx, dy)",
                  "zip(dx, dy, strict=True)",
              ),
          }

          for path, (old, new) in changes.items():
              text = path.read_text(encoding="utf-8")
              if old in text:
                  text = text.replace(old, new, 1)
                  path.write_text(text, encoding="utf-8")
              elif new not in text:
                  raise SystemExit(f"Expected expression not found in {path}")
          PY

      - name: Verify Ruff
        run: ruff check src tests

      - name: Compile
        run: python -m compileall -q src tests

      - name: Verify release metadata
        run: python scripts/release_check.py

      - name: Run tests and coverage
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py"
          coverage report --fail-under=85

      - name: Verify regression benchmark
        run: PYTHONPATH=src python -m ot_risk_lab benchmark examples/benchmark_suite.json --format json --output /tmp/benchmark.json

      - name: Check repository identity
        shell: bash
        run: |
          if grep -R -n "usaaaaasdc" . --exclude-dir=.git --exclude="*.pyc" --exclude="ci-hotfix.yml"; then
            echo "Stale repository account reference detected"
            exit 1
          fi

      - name: Commit verified CI repair
        shell: bash
        run: |
          git rm .github/workflows/ci-hotfix.yml
          git add src tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix CI lint and Python compatibility checks"
          git push origin HEAD:main
