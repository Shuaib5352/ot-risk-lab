name: Bug report
description: Report a reproducible software defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please remove sensitive OT/site information before posting publicly."
  - type: input
    id: version
    attributes:
      label: OT-RiskLab version
      placeholder: "0.5.0"
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Affected area
      options: [analyze, validate, batch, compare, register, ablate, benchmark, calibrate, evidence, provenance, packaging/API]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide sanitized inputs and the exact command if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / traceback
    validations:
      required: true
